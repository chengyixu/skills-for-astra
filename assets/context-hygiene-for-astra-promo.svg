<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Context Hygiene for Astra</title>
  <desc id="desc">A dark launch card showing a focused agent instruction router.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10121c"/><stop offset="1" stop-color="#19112c"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49b5ff"/><stop offset="1" stop-color="#9c6cff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1160" cy="364" r="250" fill="#5846d8" opacity=".22" filter="url(#blur)"/>
  <circle cx="355" cy="712" r="220" fill="#1797e8" opacity=".13" filter="url(#blur)"/>
  <g fill="none" stroke="url(#glow)" stroke-width="4" opacity=".8">
    <path d="M920 446 H1080 M920 446 L1060 258 M920 446 L1060 634"/>
  </g>
  <g stroke="#d7e8ff" stroke-width="2">
    <rect x="794" y="378" width="252" height="136" rx="24" fill="#1a2439"/>
    <rect x="1090" y="202" width="260" height="110" rx="20" fill="#17203a"/>
    <rect x="1090" y="391" width="260" height="110" rx="20" fill="#17203a"/>
    <rect x="1090" y="580" width="260" height="110" rx="20" fill="#17203a"/>
  </g>
  <g fill="#77c8ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2">
    <text x="844" y="436">THIN ROUTER</text>
  </g>
  <g fill="#d8eaff" font-family="Arial, Helvetica, sans-serif" font-size="19" opacity=".86">
