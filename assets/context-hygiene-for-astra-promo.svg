    <text x="1124" y="452">ON-DEMAND DETAIL</text>
    <text x="1124" y="641">CLEAR BOUNDARIES</text>
  </g>
  <text x="145" y="260" fill="#a9bcdd" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="6">OPEN AGENT SKILL</text>
  <text x="145" y="360" fill="#f5f7ff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700">Context Hygiene for Astra</text>
  <text x="145" y="426" fill="#b9c7e8" font-family="Arial, Helvetica, sans-serif" font-size="28">Thin prompts. Clear boundaries. Better agents.</text>
  <rect x="145" y="510" width="250" height="7" rx="3.5" fill="url(#glow)"/>
